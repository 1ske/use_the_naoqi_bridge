# naoqisim runs from NAOQI_ATTEMPT_v1 (`docker compose up naoqisim` there);
# open a world from webots/worlds/ in Webots first.
x-naoqi-client: &naoqi-client
  build: docker/naoqi
  platform: linux/amd64
  volumes:
    - ./src:/app
  working_dir: /app
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  app:
    <<: *naoqi-client
    environment:
      NAO_IP: ${NAO_IP:-host.docker.internal}  # naoqisim's published port on the Mac

  # HTTP bridge for the MCP server (src/bridge.py). Only reachable from the Mac.
  bridge:
    <<: *naoqi-client
    command: python bridge.py
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      NAO_IP: ${NAO_IP:-host.docker.internal}
      BRIDGE_CLIENT_TIMEOUT: ${BRIDGE_CLIENT_TIMEOUT:-20}  # rest if awake and no client request for this long
      BRIDGE_AUTO_IMAGE: ${BRIDGE_AUTO_IMAGE:-1}  # 1: every result carries one image (top above bottom camera), 0: only look/look_around/scan
      BRIDGE_IMAGE_GRID: ${BRIDGE_IMAGE_GRID:-1}  # 1: ground-distance lines on camera images
      BRIDGE_MAX_STEP_X: ${BRIDGE_MAX_STEP_X:-0.06}  # gait step length (m); NAOqi default 0.04, max 0.08
      PYTHONUNBUFFERED: "1"
    stop_signal: SIGTERM
    stop_grace_period: 30s  # time to stop walking and rest before Docker kills it
